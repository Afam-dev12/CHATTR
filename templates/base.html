<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CHATTR</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="{{ url_for(
          'static'
          filename='css/style.css') }}">
</head>

<body class="{% if current_user.is_authenticated and current_user.theme == 'light' %}bg-white text-black{% else %}bg-gray-950 text-white{% endif %}">
 {% with messages = get_flashed_messages() %}     
    
    {% if messages %}

       <div class=""fixed top-5 right-5 z-50>

            {% for message in messages %}

               <div class="bg-blue-500 text-white p-4 rounded-x1 mb-2">
                  
                  {{ message }}

               </div>

            {% endfor %}   

       </div>

      {% endwith %}

      {% block content %}

      {% endblock %}
</body>

</html>
