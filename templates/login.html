{% extends "base.html" %}

{% block content %}

<div class="h-screen flex items-center justify-center">

    <div class="bg-gray-900 p-10 rounded-2xl w-[400px]">
          
        <h1 class="text-4xl font-bold mb-6 text-center">
            CHATTR
        </h1>

        <form method="POST">

            <input
                 type="email"
                 name="email"
                 placeholder="Email"
                 required
                 class="w-full p-3 rounded-xl bg-gray-800 mb-4">

            <input
                type="password"     
                name="password"
                placeholder="Password"
                required
                class="w-full p-3 rounded-xl bg-gray-800 mb-4">

            <button    
                 class="w-full bg-blue-500 p-3 rounded-xl">

                 Login
                
            </button>

        </form>

        <p class="mt-4 text-center">

            No account?

            <a href="/register"
               class="text-blue-400">

               Register

            </a>
        </p>

    </div>

</div>

{% endblock %}
